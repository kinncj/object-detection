name: Repository Setup

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-setup.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  setup-labels:
    runs-on: ubuntu-latest
    steps:
    - name: Setup repository labels
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          
          const labels = [
            { name: 'testing', color: '00ff00', description: 'Changes to test files or testing infrastructure' },
            { name: 'models', color: 'ff6600', description: 'Changes to AI/ML models or model-related code' },
            { name: 'core', color: 'ff0000', description: 'Changes to core detection or processing logic' },
            { name: 'dependencies', color: '0066ff', description: 'Changes to project dependencies or requirements' },
            { name: 'documentation', color: '6600ff', description: 'Changes to documentation, README, or guides' },
            { name: 'ci/cd', color: 'ffff00', description: 'Changes to CI/CD workflows or automation' },
            { name: 'size/small', color: 'c2e0c6', description: 'Small PR (< 50 lines changed)' },
            { name: 'size/medium', color: 'f9d71c', description: 'Medium PR (50-200 lines changed)' },
            { name: 'size/large', color: 'f87171', description: 'Large PR (200-500 lines changed)' },
            { name: 'size/xl', color: 'dc2626', description: 'Extra large PR (> 500 lines changed)' },
            { name: 'bug', color: 'ee0701', description: 'Something isn\'t working' },
            { name: 'enhancement', color: '84b6eb', description: 'New feature or request' },
            { name: 'good first issue', color: '7057ff', description: 'Good for newcomers' },
            { name: 'help wanted', color: '008672', description: 'Extra attention is needed' },
            { name: 'performance', color: 'ff9500', description: 'Performance improvements' },
            { name: 'security', color: '000000', description: 'Security-related changes' },
            { name: 'breaking change', color: 'b60205', description: 'Breaking API changes' },
            { name: 'needs review', color: 'fbca04', description: 'Waiting for code review' },
            { name: 'auto-merge', color: '00ff88', description: 'Safe to auto-merge when CI passes' }
          ];
          
          for (const label of labels) {
            try {
              // Try to update label first (if it exists)
              await github.rest.issues.updateLabel({
                owner,
                repo,
                name: label.name,
                color: label.color,
                description: label.description
              });
              console.log(`✅ Updated label: ${label.name}`);
            } catch (error) {
              if (error.status === 404) {
                // Label doesn't exist, create it
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  console.log(`✅ Created label: ${label.name}`);
                } catch (createError) {
                  console.log(`❌ Failed to create label ${label.name}: ${createError.message}`);
                }
              } else {
                console.log(`❌ Failed to update label ${label.name}: ${error.message}`);
              }
            }
          }

  setup-branch-protection:
    runs-on: ubuntu-latest
    needs: setup-labels
    steps:
    - name: Setup branch protection rules
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          
          const protectionRules = {
            required_status_checks: {
              strict: true,
              contexts: [
                'test-suite',
                'lint-check',
                'security-scan'
              ]
            },
            enforce_admins: false,
            required_pull_request_reviews: {
              required_approving_review_count: 1,
              dismiss_stale_reviews: true,
              require_code_owner_reviews: false
            },
            restrictions: null,
            allow_force_pushes: false,
            allow_deletions: false
          };
          
          try {
            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch: 'main',
              ...protectionRules
            });
            console.log('✅ Updated main branch protection rules');
          } catch (error) {
            console.log(`⚠️ Could not update branch protection: ${error.message}`);
            console.log('This might require admin permissions or the repository might not exist yet.');
          }

  create-codeowners:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create CODEOWNERS file
      run: |
        mkdir -p .github
        cat > .github/CODEOWNERS << 'EOF'
        # Global owners
        * @kinncj
        
        # Core detection and processing logic
        /detection/ @kinncj
        /processor/ @kinncj
        /models/ @kinncj
        
        # Tests - require review from maintainers
        /tests/ @kinncj
        
        # CI/CD and automation
        /.github/ @kinncj
        
        # Documentation
        *.md @kinncj
        /docs/ @kinncj
        
        # Configuration and dependencies
        requirements*.txt @kinncj
        environment.yml @kinncj
        setup.sh @kinncj
        /config/ @kinncj
        EOF
        
        echo "✅ Created .github/CODEOWNERS file"
    
    - name: Commit CODEOWNERS if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if ! git diff --quiet .github/CODEOWNERS; then
          git add .github/CODEOWNERS
          git commit -m "Add CODEOWNERS file for automated code review assignment"
          git push
          echo "✅ Committed CODEOWNERS changes"
        else
          echo "ℹ️ CODEOWNERS file unchanged"
        fi
