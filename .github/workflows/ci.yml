name: CI - Object Detection Tests

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'environment.yml'
      - 'pyproject.toml'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'environment.yml'
      - 'pyproject.toml'
  workflow_dispatch:  # Allow manual triggering

# Set required status check names for branch protection
# These job names must match the branch protection rules in repo-setup.yml

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: ${{ matrix.python-version }}
        miniforge-version: latest
        activate-environment: object-detection-ci
        use-mamba: true
    
    - name: Cache conda environment
      uses: actions/cache@v4
      with:
        path: ~/conda_pkgs_dir
        key: ${{ runner.os }}-conda-${{ hashFiles('environment.yml') }}
        restore-keys: |
          ${{ runner.os }}-conda-
    
    - name: Install dependencies via conda
      shell: bash -el {0}
      run: |
        # Install core dependencies via conda for better compatibility
        conda install -c conda-forge -c pytorch \
          python=3.11 \
          pytorch \
          torchvision \
          torchaudio \
          numpy \
          opencv \
          pillow \
          tqdm \
          requests \
          imageio \
          imageio-ffmpeg \
          decorator=4.4.2 \
          moviepy=1.0.3 \
          proglog \
          pytest \
          pytest-cov \
          -y
    
    - name: Install pip dependencies
      shell: bash -el {0}
      run: |
        pip install transformers>=4.20.0 ultralytics>=8.0.0
    
    - name: Verify installation
      shell: bash -el {0}
      run: |
        python -c "
        try:
            import torch
            import transformers
            import cv2
            import ultralytics
            from moviepy.editor import VideoFileClip
            print('✅ All core dependencies imported successfully')
            print(f'PyTorch version: {torch.__version__}')
            print(f'CUDA available: {torch.cuda.is_available()}')
            print('✅ moviepy.editor import successful')
        except ImportError as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "
    
    - name: Run core tests (always must pass)
      shell: bash -el {0}
      run: |
        python -m pytest tests/test_base.py tests/test_config.py tests/test_drawer.py tests/test_factory.py -v --tb=short
    
    - name: Run all tests with coverage
      shell: bash -el {0}
      run: |
        python -m pytest tests/ -v --tb=short \
          --cov=models \
          --cov=detection \
          --cov=processor \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term
    
    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml
          .coverage

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install linting tools
      run: |
        pip install black flake8 mypy
    
    - name: Run Black formatter check
      run: |
        black --check --diff .
    
    - name: Run Flake8 linter
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run MyPy type checker
      run: |
        mypy models/ detection/ processor/ --ignore-missing-imports || true

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
